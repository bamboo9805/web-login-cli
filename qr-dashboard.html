<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR 快速登录面板</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
  <div class="mx-auto flex min-h-screen max-w-5xl flex-col px-4 py-8 sm:px-6 lg:px-8">
    <header class="mb-8 flex flex-col gap-4 rounded-3xl border border-white/10 bg-white/5 p-6 shadow-2xl shadow-black/20 backdrop-blur sm:flex-row sm:items-center sm:justify-between">
      <div>
        <p class="text-sm uppercase tracking-[0.2em] text-cyan-300">QR Quick Login</p>
        <h1 class="mt-2 text-3xl font-semibold text-white">当前站点：<span id="currentDomain">-</span></h1>
        <p id="targetUrl" class="mt-2 text-sm text-slate-400"></p>
      </div>
      <form id="domainForm" class="flex w-full flex-col gap-3 sm:w-auto sm:min-w-[360px] sm:flex-row">
        <input
          id="domainInput"
          type="text"
          placeholder="输入域名，例如 jd.com"
          class="w-full rounded-2xl border border-white/10 bg-slate-900/80 px-4 py-3 text-base text-white outline-none ring-0 placeholder:text-slate-500 focus:border-cyan-400"
        />
        <button
          type="submit"
          class="rounded-2xl bg-cyan-500 px-5 py-3 font-medium text-slate-950 transition hover:bg-cyan-400"
        >切换站点</button>
      </form>
    </header>

    <main class="grid flex-1 gap-6 lg:grid-cols-[1.3fr_0.9fr]">
      <section class="rounded-3xl border border-white/10 bg-white/5 p-6 shadow-2xl shadow-black/20 backdrop-blur">
        <div class="flex items-center justify-between">
          <div>
            <h2 class="text-xl font-semibold text-white">登录二维码</h2>
            <p class="mt-1 text-sm text-slate-400">二维码会通过 SSE 实时更新，前端也会每 5 秒做一次状态同步。</p>
          </div>
          <button
            id="refreshButton"
            type="button"
            class="rounded-2xl border border-cyan-400/40 bg-cyan-400/10 px-4 py-2 text-sm font-medium text-cyan-200 transition hover:border-cyan-300 hover:bg-cyan-400/20"
          >手动刷新</button>
        </div>

        <div class="mt-6 flex min-h-[420px] items-center justify-center rounded-3xl border border-dashed border-white/10 bg-slate-950/50 p-6">
          <img id="qrImage" alt="登录二维码" class="hidden max-h-[360px] max-w-full rounded-2xl bg-white p-4 shadow-lg" />
          <div id="qrPlaceholder" class="text-center text-slate-400">
            <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-full border border-white/10 bg-white/5 text-2xl">⌛</div>
            <p class="mt-4 text-lg text-slate-200">正在准备二维码</p>
            <p class="mt-2 text-sm text-slate-500">如果浏览器尚未打开，首次加载可能需要几秒钟。</p>
          </div>
        </div>
      </section>

      <aside class="flex flex-col gap-6">
        <section class="rounded-3xl border border-white/10 bg-white/5 p-6 shadow-2xl shadow-black/20 backdrop-blur">
          <div class="flex items-center justify-between gap-3">
            <h2 class="text-xl font-semibold text-white">登录状态</h2>
            <span id="statusBadge" class="rounded-full border border-amber-400/30 bg-amber-400/10 px-3 py-1 text-sm font-medium text-amber-200">等待中</span>
          </div>
          <p id="statusMessage" class="mt-4 text-sm leading-6 text-slate-300">正在连接二维码监控服务...</p>
          <div class="mt-5 space-y-3 text-sm text-slate-400">
            <div class="flex justify-between gap-4"><span>连接状态</span><span id="connectedValue">-</span></div>
            <div class="flex justify-between gap-4"><span>更新时间</span><span id="lastUpdateValue">-</span></div>
            <div class="flex justify-between gap-4"><span>二维码年龄</span><span id="qrAgeValue">-</span></div>
            <div class="flex justify-between gap-4"><span>刷新次数</span><span id="refreshCountValue">0</span></div>
          </div>
        </section>

        <section class="rounded-3xl border border-white/10 bg-white/5 p-6 shadow-2xl shadow-black/20 backdrop-blur">
          <h2 class="text-xl font-semibold text-white">会话信息</h2>
          <div class="mt-4 space-y-3 text-sm text-slate-400">
            <div class="flex justify-between gap-4"><span>Debug Port</span><span id="debugPortValue">-</span></div>
            <div class="flex justify-between gap-4"><span>Monitor Port</span><span id="monitorPortValue">-</span></div>
            <div class="flex justify-between gap-4"><span>Page URL</span><span id="pageUrlValue" class="max-w-[220px] truncate text-right">-</span></div>
            <div class="flex justify-between gap-4"><span>过期时间</span><span id="expiresAtValue">-</span></div>
          </div>
          <div id="errorBox" class="mt-5 hidden rounded-2xl border border-rose-400/30 bg-rose-400/10 px-4 py-3 text-sm text-rose-200"></div>
        </section>
      </aside>
    </main>
  </div>

  <script>
    const statusStyles = {
      waiting: 'border-amber-400/30 bg-amber-400/10 text-amber-200',
      scanned: 'border-sky-400/30 bg-sky-400/10 text-sky-200',
      logged_in: 'border-emerald-400/30 bg-emerald-400/10 text-emerald-200',
      timeout: 'border-rose-400/30 bg-rose-400/10 text-rose-200',
    };

    const state = {
      domain: getDomainFromPath(),
      eventSource: null,
      reconnectTimer: null,
      pollTimer: null,
    };

    const elements = {
      currentDomain: document.getElementById('currentDomain'),
      targetUrl: document.getElementById('targetUrl'),
      domainForm: document.getElementById('domainForm'),
      domainInput: document.getElementById('domainInput'),
      qrImage: document.getElementById('qrImage'),
      qrPlaceholder: document.getElementById('qrPlaceholder'),
      refreshButton: document.getElementById('refreshButton'),
      statusBadge: document.getElementById('statusBadge'),
      statusMessage: document.getElementById('statusMessage'),
      connectedValue: document.getElementById('connectedValue'),
      lastUpdateValue: document.getElementById('lastUpdateValue'),
      qrAgeValue: document.getElementById('qrAgeValue'),
      refreshCountValue: document.getElementById('refreshCountValue'),
      debugPortValue: document.getElementById('debugPortValue'),
      monitorPortValue: document.getElementById('monitorPortValue'),
      pageUrlValue: document.getElementById('pageUrlValue'),
      expiresAtValue: document.getElementById('expiresAtValue'),
      errorBox: document.getElementById('errorBox'),
    };

    function getDomainFromPath() {
      const parts = window.location.pathname.split('/').filter(Boolean);
      return decodeURIComponent(parts[1] || 'jd.com');
    }

    function formatDate(value) {
      if (!value) {
        return '-';
      }
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) {
        return '-';
      }
      return date.toLocaleString();
    }

    function updateHeader(domain) {
      document.title = `QR 快速登录 - ${domain}`;
      elements.currentDomain.textContent = domain;
      elements.domainInput.value = domain;
    }

    function setStatusBadge(status) {
      const style = statusStyles[status] || statusStyles.waiting;
      elements.statusBadge.className = `rounded-full border px-3 py-1 text-sm font-medium ${style}`;
      elements.statusBadge.textContent = {
        waiting: '等待扫码',
        scanned: '已扫码待确认',
        logged_in: '登录成功',
        timeout: '会话超时',
      }[status] || '等待中';
    }

    function renderPayload(payload) {
      if (!payload) {
        return;
      }
      updateHeader(payload.domain || state.domain);
      elements.targetUrl.textContent = payload.targetUrl || '';
      setStatusBadge(payload.loginStatus || 'waiting');
      elements.statusMessage.textContent = payload.message || '等待二维码...';
      elements.connectedValue.textContent = payload.connected ? '已连接' : '未连接';
      elements.lastUpdateValue.textContent = formatDate(payload.lastUpdateAt);
      elements.qrAgeValue.textContent = typeof payload.qrAgeSec === 'number' ? `${payload.qrAgeSec}s` : '-';
      elements.refreshCountValue.textContent = String(payload.refreshCount || 0);
      elements.debugPortValue.textContent = payload.debugPort || '-';
      elements.monitorPortValue.textContent = payload.monitorPort || '-';
      elements.pageUrlValue.textContent = payload.pageUrl || '-';
      elements.pageUrlValue.title = payload.pageUrl || '';
      elements.expiresAtValue.textContent = formatDate(payload.expiresAt);

      if (payload.qrDataUrl) {
        elements.qrImage.src = payload.qrDataUrl;
        elements.qrImage.classList.remove('hidden');
        elements.qrPlaceholder.classList.add('hidden');
      } else {
        elements.qrImage.classList.add('hidden');
        elements.qrPlaceholder.classList.remove('hidden');
      }

      if (payload.lastError) {
        elements.errorBox.textContent = payload.lastError;
        elements.errorBox.classList.remove('hidden');
      } else {
        elements.errorBox.classList.add('hidden');
        elements.errorBox.textContent = '';
      }
    }

    async function fetchJson(url, options = {}) {
      const response = await fetch(url, options);
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) {
        throw new Error(payload.error || `Request failed: ${response.status}`);
      }
      return payload;
    }

    async function syncSnapshot() {
      const payload = await fetchJson(`/api/qr/${encodeURIComponent(state.domain)}`);
      renderPayload(payload);
    }

    async function refreshQr() {
      elements.refreshButton.disabled = true;
      elements.refreshButton.textContent = '刷新中...';
      try {
        const payload = await fetchJson(`/api/qr/${encodeURIComponent(state.domain)}/refresh`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
        });
        renderPayload(payload);
      } catch (error) {
        elements.errorBox.textContent = error.message || String(error);
        elements.errorBox.classList.remove('hidden');
      } finally {
        elements.refreshButton.disabled = false;
        elements.refreshButton.textContent = '手动刷新';
      }
    }

    function clearConnection() {
      if (state.eventSource) {
        state.eventSource.close();
        state.eventSource = null;
      }
      if (state.reconnectTimer) {
        clearTimeout(state.reconnectTimer);
        state.reconnectTimer = null;
      }
    }

    function connectEvents() {
      clearConnection();
      const source = new EventSource(`/events?domain=${encodeURIComponent(state.domain)}`);
      state.eventSource = source;

      source.addEventListener('qr_updated', (event) => {
        renderPayload(JSON.parse(event.data));
      });

      source.addEventListener('login_status', (event) => {
        const payload = JSON.parse(event.data);
        renderPayload(payload);
        if (payload.loginStatus === 'timeout') {
          source.close();
          state.reconnectTimer = setTimeout(() => {
            connectEvents();
            syncSnapshot().catch(() => {});
          }, 1200);
        }
      });

      source.onerror = () => {
        source.close();
        state.reconnectTimer = setTimeout(() => {
          connectEvents();
        }, 2000);
      };
    }

    function startPolling() {
      if (state.pollTimer) {
        clearInterval(state.pollTimer);
      }
      state.pollTimer = setInterval(() => {
        syncSnapshot().catch(() => {});
      }, 5000);
    }

    elements.domainForm.addEventListener('submit', (event) => {
      event.preventDefault();
      const nextDomain = elements.domainInput.value.trim().replace(/^https?:\/\//, '').replace(/[/?#].*$/, '');
      if (!nextDomain) {
        return;
      }
      window.location.href = `/qr/${encodeURIComponent(nextDomain)}`;
    });

    elements.refreshButton.addEventListener('click', () => {
      refreshQr();
    });

    updateHeader(state.domain);
    syncSnapshot().catch((error) => {
      elements.errorBox.textContent = error.message || String(error);
      elements.errorBox.classList.remove('hidden');
    });
    connectEvents();
    startPolling();
  </script>
</body>
</html>
